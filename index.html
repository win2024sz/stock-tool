<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>股票指数计算器</title>
  <meta name="theme-color" content="#f2e9df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="股票计算器">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./app-icon-180.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f2e9df;
      --panel: #fffdf9;
      --ink: #2c2723;
      --muted: #766b63;
      --line: #e4d6ca;
      --field: #fbf7f2;
      --accent: #d96245;
      --accent-deep: #bd4f34;
      --accent-soft: #fff1ea;
      --focus: #d96245;
      --rise: #d34b3f;
      --fall: #23805e;
      --neutral: #3f3a36;
      --shadow: 0 10px 30px rgba(91, 65, 49, .08);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(255, 255, 255, .18), rgba(255, 255, 255, .18)),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .app {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(44px, env(safe-area-inset-bottom));
    }

    .app-header {
      position: relative;
      margin-bottom: 16px;
      padding: 22px 24px 21px 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .app-header::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5px;
      background: var(--accent);
      content: "";
    }

    .app-eyebrow {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-deep);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .tool {
      margin-top: 14px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .tool:first-of-type { margin-top: 0; }

    .tool-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-size: 19px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    h2::before {
      width: 4px;
      height: 20px;
      border-radius: 2px;
      background: var(--accent);
      content: "";
    }

    .clear-btn {
      min-width: 58px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #fff;
      background: var(--accent);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease, transform .16s ease;
    }

    .clear-btn:hover {
      border-color: var(--accent-deep);
      background: var(--accent-deep);
    }

    .clear-btn:active { transform: translateY(1px); }

    .clear-btn:focus-visible {
      outline: 3px solid rgba(217, 98, 69, .22);
      outline-offset: 2px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .input-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 52px;
      padding: 0 48px 0 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: 0;
      background: var(--field);
      color: var(--ink);
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button { appearance: none; }

    input::placeholder {
      color: #ae9f94;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--focus);
      background: #fffefa;
      box-shadow: 0 0 0 3px rgba(217, 98, 69, .13);
    }

    .unit {
      position: absolute;
      top: 50%;
      right: 13px;
      color: var(--muted);
      font-size: 13px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .result-item {
      min-width: 0;
      padding: 14px;
      border: 1px solid #ebded4;
      border-radius: 7px;
      background: #faf6f1;
    }

    .result-item.primary {
      border-color: #edcfc2;
      background: var(--accent-soft);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .result-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .result-value {
      display: flex;
      min-height: 34px;
      align-items: baseline;
      gap: 4px;
      color: var(--neutral);
      font-size: 26px;
      font-weight: 750;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .result-value small {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .rise { color: var(--rise); }
    .fall { color: var(--fall); }
    .neutral { color: var(--neutral); }

    @media (max-width: 620px) {
      .app {
        width: min(100% - 24px, 760px);
        padding-top: max(16px, env(safe-area-inset-top));
      }

      .app-header {
        margin-bottom: 12px;
        padding: 18px 18px 18px 22px;
      }

      h1 { font-size: 27px; }

      .tool {
        margin-top: 12px;
        padding: 16px;
      }

      .tool-head { margin-bottom: 15px; }

      .input-grid { gap: 10px; }

      .input-grid.three {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .input-grid.three > div:first-child { grid-column: 1 / -1; }

      .result-value { font-size: 24px; }
    }

    @media (max-width: 380px) {
      .app { width: min(100% - 18px, 760px); }
      .app-header { padding-right: 15px; }
      .tool { padding: 14px; }
      .result-item { padding: 12px; }
      .result-value { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <span class="app-eyebrow">投资计算工具</span>
      <h1>股票指数计算器</h1>
    </header>

    <section class="tool" aria-labelledby="stockChangeTitle">
      <div class="tool-head">
        <h2 id="stockChangeTitle">股价涨跌幅</h2>
        <button class="clear-btn" type="button" data-clear="stock">清空</button>
      </div>
      <div class="input-grid">
        <div>
          <label for="startPrice">起始价</label>
          <div class="input-wrap">
            <input id="startPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">元</span>
          </div>
        </div>
        <div>
          <label for="endPrice">结束价</label>
          <div class="input-wrap">
            <input id="endPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">元</span>
          </div>
        </div>
      </div>
      <div class="result-grid" aria-live="polite">
        <div class="result-item primary">
          <span class="result-label" id="stockRateLabel">涨跌幅</span>
          <strong class="result-value" id="stockRate">—</strong>
        </div>
        <div class="result-item">
          <span class="result-label">每股变化</span>
          <strong class="result-value" id="stockDifference">—</strong>
        </div>
      </div>
    </section>

    <section class="tool" aria-labelledby="indexChangeTitle">
      <div class="tool-head">
        <h2 id="indexChangeTitle">指数涨跌幅</h2>
        <button class="clear-btn" type="button" data-clear="index">清空</button>
      </div>
      <div class="input-grid">
        <div>
          <label for="currentIndex">当前指数</label>
          <div class="input-wrap">
            <input id="currentIndex" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">点</span>
          </div>
        </div>
        <div>
          <label for="targetIndex">目标指数</label>
          <div class="input-wrap">
            <input id="targetIndex" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">点</span>
          </div>
        </div>
      </div>
      <div class="result-grid" aria-live="polite">
        <div class="result-item primary">
          <span class="result-label" id="indexRateLabel">距离目标</span>
          <strong class="result-value" id="indexRate">—</strong>
        </div>
        <div class="result-item">
          <span class="result-label">相差点数</span>
          <strong class="result-value" id="indexDifference">—</strong>
        </div>
      </div>
    </section>

    <section class="tool" aria-labelledby="marketCapTitle">
      <div class="tool-head">
        <h2 id="marketCapTitle">市值反推股价</h2>
        <button class="clear-btn" type="button" data-clear="market">清空</button>
      </div>
      <div class="input-grid three">
        <div>
          <label for="currentPrice">当前股价</label>
          <div class="input-wrap">
            <input id="currentPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">元</span>
          </div>
        </div>
        <div>
          <label for="currentMarketCap">当前市值</label>
          <div class="input-wrap">
            <input id="currentMarketCap" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">亿</span>
          </div>
        </div>
        <div>
          <label for="targetMarketCap">目标市值</label>
          <div class="input-wrap">
            <input id="targetMarketCap" type="number" min="0" step="0.01" inputmode="decimal" placeholder="请输入" autocomplete="off">
            <span class="unit">亿</span>
          </div>
        </div>
      </div>
      <div class="result-grid" aria-live="polite">
        <div class="result-item primary">
          <span class="result-label">目标股价</span>
          <strong class="result-value" id="marketTargetPrice">—</strong>
        </div>
        <div class="result-item">
          <span class="result-label" id="marketRateLabel">预计涨跌幅</span>
          <strong class="result-value" id="marketRate">—</strong>
        </div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const numberFormat = new Intl.NumberFormat("zh-CN", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    const groups = {
      stock: ["startPrice", "endPrice"],
      market: ["currentPrice", "currentMarketCap", "targetMarketCap"],
      index: ["currentIndex", "targetIndex"]
    };

    function readNumber(id) {
      const raw = $(id).value.trim();
      if (raw === "") return null;
      const value = Number(raw);
      return Number.isFinite(value) ? value : null;
    }

    function setTone(element, value) {
      element.classList.remove("rise", "fall", "neutral");
      element.classList.add(value > 0 ? "rise" : value < 0 ? "fall" : "neutral");
    }

    function resetResult(ids, labels = {}) {
      ids.forEach((id) => {
        $(id).textContent = "—";
        $(id).classList.remove("rise", "fall", "neutral");
      });
      Object.entries(labels).forEach(([id, text]) => { $(id).textContent = text; });
    }

    function calculateStockChange() {
      const start = readNumber("startPrice");
      const end = readNumber("endPrice");
      if (start === null || end === null || start <= 0) {
        resetResult(["stockRate", "stockDifference"], { stockRateLabel: "涨跌幅" });
        return;
      }

      const difference = end - start;
      const rate = difference / start * 100;
      $("stockRateLabel").textContent = difference > 0 ? "涨幅" : difference < 0 ? "跌幅" : "涨跌幅";
      $("stockRate").textContent = `${Math.abs(rate).toFixed(2)}%`;
      $("stockDifference").innerHTML = `${difference > 0 ? "+" : ""}${numberFormat.format(difference)} <small>元</small>`;
      setTone($("stockRate"), difference);
      setTone($("stockDifference"), difference);
    }

    function calculateMarketCap() {
      const currentPrice = readNumber("currentPrice");
      const currentCap = readNumber("currentMarketCap");
      const targetCap = readNumber("targetMarketCap");
      if (currentPrice === null || currentCap === null || targetCap === null || currentPrice <= 0 || currentCap <= 0) {
        resetResult(["marketTargetPrice", "marketRate"], { marketRateLabel: "预计涨跌幅" });
        return;
      }

      const targetPrice = currentPrice * targetCap / currentCap;
      const difference = targetPrice - currentPrice;
      const rate = difference / currentPrice * 100;
      $("marketTargetPrice").innerHTML = `${numberFormat.format(targetPrice)} <small>元</small>`;
      $("marketRateLabel").textContent = difference > 0 ? "预计上涨" : difference < 0 ? "预计下跌" : "预计涨跌幅";
      $("marketRate").textContent = `${Math.abs(rate).toFixed(2)}%`;
      setTone($("marketTargetPrice"), difference);
      setTone($("marketRate"), difference);
    }

    function calculateIndexChange() {
      const current = readNumber("currentIndex");
      const target = readNumber("targetIndex");
      if (current === null || target === null || current <= 0) {
        resetResult(["indexRate", "indexDifference"], { indexRateLabel: "距离目标" });
        return;
      }

      const difference = target - current;
      const rate = difference / current * 100;
      $("indexRateLabel").textContent = difference > 0 ? "还需上涨" : difference < 0 ? "还需下跌" : "已到目标";
      $("indexRate").textContent = `${Math.abs(rate).toFixed(2)}%`;
      $("indexDifference").innerHTML = `${difference > 0 ? "+" : ""}${numberFormat.format(difference)} <small>点</small>`;
      setTone($("indexRate"), difference);
      setTone($("indexDifference"), difference);
    }

    groups.stock.forEach((id) => $(id).addEventListener("input", calculateStockChange));
    groups.market.forEach((id) => $(id).addEventListener("input", calculateMarketCap));
    groups.index.forEach((id) => $(id).addEventListener("input", calculateIndexChange));

    document.querySelectorAll("[data-clear]").forEach((button) => {
      button.addEventListener("click", () => {
        const group = button.dataset.clear;
        groups[group].forEach((id) => { $(id).value = ""; });
        if (group === "stock") calculateStockChange();
        if (group === "market") calculateMarketCap();
        if (group === "index") calculateIndexChange();
        $(groups[group][0]).focus();
      });
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
